name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv tool install ruff
      - run: ruff check src/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv run pytest --cov=mistune_json --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml

  floor:
    name: Minimum Mistune
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      - run: uv pip install --python .venv/bin/python 'mistune==3.1.3'
      - run: uv run --no-sync python -c "import mistune; assert mistune.__version__ == '3.1.3', mistune.__version__"
      - run: uv run --no-sync pytest